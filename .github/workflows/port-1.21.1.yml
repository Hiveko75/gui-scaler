# Builds the Minecraft 1.21.1 Fabric jar when started by hand from the Actions tab.
# A release is only published from a manual run with "publish" ticked.
name: Build 1.21.1 (Fabric)

# Started by hand only (Actions -> Run workflow): no builds on push or pull requests.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jar as a release (tag from hiveko_release)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :fabric:build --stacktrace

      - name: Check jar
        run: |
          JAR=$(ls fabric/build/libs/*.jar | grep -v -e sources -e javadoc -e dev)
          ls -l fabric/build/libs
          unzip -p "$JAR" fabric.mod.json
          javap -p -cp "$JAR" eu.netleak.guiscaler.config.GuiScalerConfigModel

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: guiscaler-1.21.1-fabric
          path: fabric/build/libs/*.jar
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'fabric/build/libs/*.jar'

      - name: Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls fabric/build/libs/*.jar | grep -v -e sources -e javadoc -e dev)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "GUI Scaler $TAG" \
            --notes "Unofficial build of [GUI Scaler](https://modrinth.com/mod/auto-gui-scaler) 1.1.3 by Netleak (LGPL-3.0) for Minecraft 1.21.1 (Fabric), with the custom rule fix from the 1.21.11 version (369460b): custom rules are a list of \"width:scale\" strings, so they load from the config file and can be edited in the config screen. Source: the port-1.21.1 branch of this repository. Requires Fabric API and Cloth Config."
